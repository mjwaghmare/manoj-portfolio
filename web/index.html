  <!-- flutter_bootstrap.js only discovers these after it runs, so start the downloads now.

  <style>
    html, body { margin: 0; height: 100%; background: #FDFDFE; }
    html.dark, html.dark body { background: #080E16; }

    @font-face {
      font-family: 'Loader Playfair';
      src: url('assets/assets/fonts/PlayfairDisplay-SemiBoldItalic.ttf') format('truetype');
      font-weight: 600;
      font-style: italic;
      font-display: block;
    }

    /* Splash shown until Flutter paints its first frame; colours follow AppTheme. */
    #loader {
      --g1: #0A5FE0; --g2: #5E3DF7;
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center;
      background: #FDFDFE;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    html.dark #loader { --g1: #3792F5; --g2: #704DF7; background: #111115; }
    #loader.done { opacity: 0; transform: scale(1.03); pointer-events: none; }

    #loader .title {
      margin: 0;
      font: italic 600 clamp(30px, 6.5vw, 76px)/1.3 'Loader Playfair', Georgia, serif;
      letter-spacing: -0.01em;
      opacity: 0; transform: translateY(14px);
      transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #loader.ready .title { opacity: 1; transform: none; }

    /* The gradient only paints inside the box, so the padding (cancelled by the negative margin)
       makes room for descenders and the italic overhang that would otherwise be cut off. */
    #loader .text {
      display: inline-block;
      padding: 0.1em 0.18em 0.25em; margin: -0.1em -0.18em -0.25em;
      background: linear-gradient(90deg, var(--g1), var(--g2), var(--g1)) 0 0 / 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
      animation: loader-shimmer 3s linear infinite;
    }
    #loader .phrase {
      display: inline-block;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #loader .phrase.out { opacity: 0; transform: translateY(-0.25em); }
    #loader .phrase.enter { opacity: 0; transform: translateY(0.25em); transition: none; }

    #loader .dots span {
      display: inline-block; color: var(--g2);
      animation: loader-dot 1.4s ease-in-out infinite;
    }
    #loader .dots span:nth-child(2) { animation-delay: 0.2s; }
    #loader .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes loader-shimmer { to { background-position: -200% 0; } }
    @keyframes loader-dot {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-0.12em); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loader .text, #loader .dots span { animation: none; }
      #loader .phrase.out, #loader .phrase.enter { transform: none; }
      #loader .dots span { opacity: 0.6; }
    }
  </style>
  <script>
    // Paint the saved (or system) theme background before Flutter loads, so there is no flash.
    // Must match ThemeProvider's key; shared_preferences stores it as "flutter.is_dark_mode".
    (function () {
      var dark = false;
      try {
        var saved = window.localStorage.getItem('flutter.is_dark_mode');
        dark = saved === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : saved === 'true';
      } catch (e) {}
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>

<body>
  <noscript>
    <h1>Manoj Waghmare — Senior Mobile Developer</h1>
    <p>Senior Mobile Developer in Pune, India with 7+ years of experience building production Android and iOS applications. This site requires JavaScript.</p>
    <p><a href="https://github.com/mjwaghmare">GitHub</a> · <a href="https://www.linkedin.com/in/manoj-waghmare-90a883124/">LinkedIn</a></p>
  </noscript>
  <div id="loader" role="status" aria-label="Loading">
    <p class="title" aria-hidden="true"><span class="phrase"><span class="text">Warming up the widgets</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></span></p>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('loader');
      var phrase = loader.querySelector('.phrase');
      var text = loader.querySelector('.text');
      var lines = ['Warming up the widgets', 'Painting the pixels', 'Almost there'];
      var index = 0;

      // Each line slides up and out, then the next one rises in from below.
      var cycle = setInterval(function () {
        phrase.classList.add('out');
        setTimeout(function () {
          index = (index + 1) % lines.length;
          text.textContent = lines[index];
          phrase.classList.remove('out');
          phrase.classList.add('enter');
          void phrase.offsetWidth; // Commit the start position so the entrance animates.
          phrase.classList.remove('enter');
        }, 300);
      }, 1500);

      // Reveal once the font is in (or after a short wait), so the text never swaps typeface mid-fade.
      var reveal = function () { loader.classList.add('ready'); };
      if (document.fonts && document.fonts.load) {
        document.fonts.load('italic 600 1em "Loader Playfair"').then(reveal, reveal);
        setTimeout(reveal, 1200);
      } else {
        reveal();
      }
      // Fired by the Flutter engine after its first frame is on screen.
      window.addEventListener('flutter-first-frame', function () {
        clearInterval(cycle);
        loader.classList.add('done');
        setTimeout(function () { loader.remove(); }, 600);
      }, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
